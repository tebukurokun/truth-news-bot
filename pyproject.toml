[tool.poetry]
name = "truth-news-bot"
version = "0.1.6"
description = "News bot for Truth Social"
authors = ["tebukuro <58774766+tebukurokun@users.noreply.github.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
click = "^8.3.2"
loguru = "^0.7.3"
python-dotenv = "^1.2.2"
